<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أطلس: الأسواق والأخبار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#0b0e11;--sf:#161a1e;--sf2:#1e2329;--tx:#eaecef;--mu:#848e9c;--ac:#f0b90b;--up:#0ecb81;--dn:#f6465d;--bd:#2b3139}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:70px}
.w{max-width:980px;margin:0 auto;padding:10px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px}
.logo{font-weight:700;font-size:20px;color:var(--ac)}
.live{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.live.ok i{background:var(--up)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.hero div{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px}
.hero b{display:block;font-size:17px}.mu{color:var(--mu);font-size:12px}
input{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit;margin-bottom:10px}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1.6fr 1.1fr 70px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.head{color:var(--mu);font-size:12px;padding:8px 12px}
.coin{display:flex;align-items:center;gap:10px;min-width:0}
.coin img{width:32px;height:32px;border-radius:50%;background:var(--sf2);flex:none}
.coin b{display:block;line-height:1.2}.coin span{color:var(--mu);font-size:12px}
.pr{text-align:end;direction:ltr}.pr b{display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
.fl-up{animation:fu 1s}.fl-dn{animation:fd 1s}
@keyframes fu{from{background:rgba(14,203,129,.25)}}@keyframes fd{from{background:rgba(246,70,93,.25)}}
svg.sp{width:70px;height:28px;display:block}
.mc{display:none}
@media(min-width:700px){.row{grid-template-columns:28px 2fr 1.2fr 1fr 1fr 90px}.mc{display:block;text-align:end;direction:ltr}.row .pc{text-align:end;direction:ltr}}
@media(max-width:699px){.pc{display:none}.pr small{display:block}}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:150px;object-fit:cover;background:var(--sf2)}
.card div{padding:10px 12px}.card a{color:var(--tx);font-weight:700;text-decoration:none;display:block;margin-bottom:6px}
.card a:hover{color:var(--ac)}.card p{margin:6px 0 0;color:var(--mu);font-size:13px}
.msg{padding:18px;text-align:center;color:var(--mu)}.msg button,.btn{background:var(--ac);color:#1e2329;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
.warn{background:var(--sf2);border:1px solid var(--ac);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.sk{height:52px;margin:8px 12px;border-radius:6px;background:linear-gradient(90deg,var(--sf2),var(--bd),var(--sf2));background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200%}}
.tabs{position:fixed;inset:auto 0 0 0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs a{flex:1;text-align:center;padding:14px 0;color:var(--mu);text-decoration:none;font-weight:600}
.tabs a.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
.pg{display:none}.pg.on{display:block}
</style>
</head>
<body>
<div class="w">
<header><div class="logo">أطلس</div><div class="live" id="live"><i></i><span id="lt">جار التحميل</span></div></header>

<section id="markets" class="pg on">
<div class="hero" id="hero"></div>
<input id="q" placeholder="ابحث عن عملة، مثل Bitcoin أو ETH">
<div id="mw"></div>
<div class="list" id="ml"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<div class="mu" style="margin-top:8px">الأسعار بالدولار من CoinGecko وتتحدث كل دقيقة. ليست نصيحة استثمارية.</div>
</section>

<section id="news" class="pg">
<div id="nw"></div>
<div class="news" id="nl"></div>
<div class="mu" style="margin-top:8px">الأخبار من Cointelegraph بالعربية، مع مصادر احتياطية عند الحاجة.</div>
</section>
</div>
<nav class="tabs"><a href="#markets" class="on">الأسواق</a><a href="#news">الأخبار</a></nav>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https?:\/\//.test(u)?u:'#';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const usd=n=>n==null?'-':n>=1?'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'$'+Number(n.toPrecision(4));
const cmp=n=>n==null?'-':'$'+new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n);
const pct=n=>n==null?'-':(n>=0?'+':'')+n.toFixed(2)+'%';
const MK='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=30&page=1&sparkline=true&price_change_percentage=24h';
const NW='https://min-api.cryptocompare.com/data/v2/news/?lang=EN';
async function get(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
let coins=[],prev={};

function spark(a,up){if(!a||!a.length)return'';const p=a.filter((_,i)=>i%4===0),mn=Math.min(...p),mx=Math.max(...p),r=mx-mn||1;
 const pts=p.map((v,i)=>(i/(p.length-1)*70).toFixed(1)+','+(26-(v-mn)/r*24).toFixed(1)).join(' ');
 return `<svg class="sp" viewBox="0 0 70 28"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="1.5"/></svg>`}

function hero(){const t=coins.slice().sort((a,b)=>b.price_change_percentage_24h-a.price_change_percentage_24h),mcap=coins.reduce((s,c)=>s+(c.market_cap||0),0);
 const card=(l,c)=>`<div><span class="mu">${l}</span><b>${esc(c.symbol.toUpperCase())}</b><span class="${c.price_change_percentage_24h>=0?'up':'dn'}">${pct(c.price_change_percentage_24h)}</span></div>`;
 $('#hero').innerHTML=`<div><span class="mu">القيمة السوقية لأكبر 30 عملة</span><b>${cmp(mcap)}</b></div>`+card('الأكثر ارتفاعاً',t[0])+card('الأكثر انخفاضاً',t[t.length-1])}

function rows(){const q=$('#q').value.trim().toLowerCase(),f=coins.filter(c=>!q||c.name.toLowerCase().includes(q)||c.symbol.toLowerCase().includes(q));
 $('#ml').innerHTML='<div class="row head"><span>#</span><span>العملة</span><span class="pr">السعر</span><span class="pc">24 ساعة</span><span class="mc">القيمة السوقية</span><span>7 أيام</span></div>'
 +(f.length?f.map(c=>{const up=c.price_change_percentage_24h>=0,fl=prev[c.id]!=null&&prev[c.id]!==c.current_price?(c.current_price>prev[c.id]?' fl-up':' fl-dn'):'';
 return `<div class="row${fl}"><span class="mu">${c.market_cap_rank}</span><div class="coin"><img src="${url(c.image)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div><b>${esc(c.name)}</b><span>${esc(c.symbol.toUpperCase())}</span></div></div><div class="pr"><b>${usd(c.current_price)}</b><small class="${up?'up':'dn'}">${pct(c.price_change_percentage_24h)}</small></div><span class="pc ${up?'up':'dn'}">${pct(c.price_change_percentage_24h)}</span><span class="mc">${cmp(c.market_cap)}</span>${spark(c.sparkline_in_7d&&c.sparkline_in_7d.price,up)}</div>`}).join(''):'<div class="msg">ما لقينا عملة بهاد الاسم.</div>')}

function live(ok,t){$('#live').className='live'+(ok?' ok':'');$('#lt').textContent=t}
async function loadMarkets(){
 try{const d=await get(MK);coins.forEach(c=>prev[c.id]=c.current_price);coins=d;ls.set('mk',{t:Date.now(),d});$('#mw').innerHTML='';hero();rows();live(true,'مباشر: '+new Date().toLocaleTimeString('en-GB'))}
 catch(e){const c=ls.get('mk');if(c&&!coins.length){coins=c.d;hero();rows()}
  live(false,'تعذر التحديث');
  $('#mw').innerHTML=`<div class="warn">${coins.length?'تعذر تحديث الأسعار، نعرض آخر بيانات محفوظة ('+new Date(c.t).toLocaleTimeString('en-GB')+'). غالباً تجاوزت حد الطلبات المجاني، جرب بعد دقيقة.':'تعذر جلب الأسعار. تأكد من الاتصال بالإنترنت.'} <button class="btn" onclick="loadMarkets()">إعادة المحاولة</button></div>`}}

const ago=s=>{const m=Math.max(1,Math.round((Date.now()/1000-s)/60));return m<60?`منذ ${m} دقيقة`:m<1440?`منذ ${Math.round(m/60)} ساعة`:`منذ ${Math.round(m/1440)} يوم`};
const RSS=[['https://ar.cointelegraph.com/rss','Cointelegraph عربي'],['https://cointelegraph.com/rss','Cointelegraph'],['https://www.coindesk.com/arc/outboundfeeds/rss/','CoinDesk']];
const txt=h=>{try{return new DOMParser().parseFromString(h||'','text/html').body.textContent.trim()}catch(e){return''}};
async function fetchNews(){
 for(const [f,name] of RSS){try{const d=await get('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f));
  if(d.status==='ok'&&d.items&&d.items.length)return d.items.map(i=>({title:txt(i.title),url:i.link,imageurl:i.thumbnail||(i.enclosure&&i.enclosure.link)||'',source:name,published_on:Date.parse(String(i.pubDate).replace(' ','T')+'Z')/1000||Date.now()/1000,body:txt(i.description)}))}catch(e){}}
 const d=await get(NW),a=(d.Data||[]).slice(0,24);if(!a.length)throw 0;return a}
async function loadNews(){
 $('#nw').innerHTML='';
 try{const a=await fetchNews();ls.set('nw',a);showNews(a)}
 catch(e){const c=ls.get('nw');if(c){showNews(c);$('#nw').innerHTML='<div class="warn">تعذر تحديث الأخبار، هذه آخر أخبار محفوظة.</div>'}
  else $('#nw').innerHTML='<div class="msg">تعذر جلب الأخبار.<br><button onclick="loadNews()">إعادة المحاولة</button></div>'}}
function showNews(a){$('#nl').innerHTML=a.map(n=>`<article class="card"><img src="${url(n.imageurl)}" alt="" loading="lazy" onerror="this.style.display='none'"><div><a href="${url(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><span class="mu">${esc((n.source_info&&n.source_info.name)||n.source)} - ${ago(n.published_on)}</span><p>${esc((n.body||'').slice(0,140))}...</p></div></article>`).join('')}

function route(){const h=location.hash==='#news'?'news':'markets';document.querySelectorAll('.pg').forEach(s=>s.classList.toggle('on',s.id===h));document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));if(h==='news'&&!$('#nl').children.length)loadNews()}
addEventListener('hashchange',route);$('#q').oninput=rows;
route();loadMarkets();setInterval(loadMarkets,60000);setInterval(()=>{if(location.hash==='#news')loadNews()},300000);
</script>
</body>
</html>
